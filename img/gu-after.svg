<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630">
  <!-- ЗАГЛУШКА: замените этот файл своим фото настроенного экрана
       (img/gu-after.jpg) и поправьте расширение в src в index.html. -->
  <defs>
    <radialGradient id="glow" cx="85%" cy="-20%" r="130%">
      <stop offset="0%" stop-color="#22345c"/>
      <stop offset="60%" stop-color="#0b0b0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="-15%" cy="115%" r="120%">
      <stop offset="0%" stop-color="#33265c"/>
      <stop offset="60%" stop-color="#0b0b0f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1120" height="630" fill="#0b0b0f"/>
  <rect width="1120" height="630" fill="url(#glow)"/>
  <rect width="1120" height="630" fill="url(#glow2)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="560" y="295" font-size="34" font-weight="600" fill="#f5f5f7">Здесь будет фото настроенного экрана</text>
    <text x="560" y="345" font-size="22" fill="#86868b">Положите файл в папку img/ и поменяйте путь в index.html</text>
  </g>
</svg>
